server.port=8081
server.compression.enabled=true
server.compression.mime-types=application/json,text/html,text/css,application/javascript,image/svg+xml

spring.jackson.default-property-inclusion=non_null

# Never let a browser or proxy keep serving old HTML/CSS/JS after a redeploy.
# no-cache forces revalidation (usually a cheap 304); the ?v= build timestamp
# on the asset URLs makes a new deployment a new cache entry altogether.
spring.web.resources.cache.cachecontrol.no-cache=true

# Uploaded lessons live outside the jar so they survive rebuilds and deployments.
app.storage.root=${CADENCE_DATA_DIR:data}
app.admin.password=${ADMIN_PASSWORD:manton626866}
# Requests from the loopback address can use the admin API without logging in.
app.admin.allow-local-requests=${ADMIN_ALLOW_LOCAL_REQUESTS:true}

# Automatic Chinese translation of transcripts via DeepSeek. Leave the API key
# empty to keep the feature off; failed lessons are retried on the next startup.
app.translation.enabled=${TRANSLATION_ENABLED:true}
app.translation.deepseek-url=${TRANSLATION_DEEPSEEK_URL:https://api.deepseek.com/chat/completions}
app.translation.deepseek-api-key=${TRANSLATION_DEEPSEEK_API_KEY:${DEEPSEEK_API_KEY:}}
app.translation.deepseek-model=${TRANSLATION_DEEPSEEK_MODEL:deepseek-chat}
app.translation.deepseek-max-output-tokens=${TRANSLATION_DEEPSEEK_MAX_OUTPUT_TOKENS:8192}
app.translation.deepseek-temperature=${TRANSLATION_DEEPSEEK_TEMPERATURE:0.2}
# Sentences are grouped into batches of roughly this many characters.
app.translation.max-batch-chars=${TRANSLATION_MAX_BATCH_CHARS:6000}
app.translation.connect-timeout-ms=${TRANSLATION_CONNECT_TIMEOUT_MS:10000}
app.translation.read-timeout-ms=${TRANSLATION_READ_TIMEOUT_MS:120000}

spring.servlet.multipart.max-file-size=50MB
spring.servlet.multipart.max-request-size=55MB

server.servlet.session.timeout=36h
server.servlet.session.cookie.http-only=true
server.servlet.session.cookie.same-site=lax
# Keep the session cookie on disk for seven days so closing the browser does
# not sign the user out. User sessions slide (see UserAuthInterceptor).
server.servlet.session.cookie.max-age=7d
